plugins {
    id 'com.android.application'
}

// CI passes the version (tag) and the run number; local builds are 0.1.0 (1).
def ver = System.getenv('RIVO_VERSION') ?: '0.1.0'
def code = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'app.rivo.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'app.rivo.tv'
        minSdk 21
        targetSdk 35
        versionCode code
        versionName ver
    }

    // A fixed key keeps updates installable over the previous version. CI
    // takes it from secrets (ANDROID_KEYSTORE_B64 etc., decoded to
    // rivo-tv.jks); without them the release is signed with the debug key.
    signingConfigs {
        release {
            def ks = file('rivo-tv.jks')
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'rivo'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig file('rivo-tv.jks').exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}
