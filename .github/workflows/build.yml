name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web UI
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm run build
      - name: Go vet and tests
        working-directory: server
        run: |
          go vet ./...
          go test ./...
          GOOS=windows go build -o /dev/null ./cmd/homecinema

  windows:
    needs: test
    runs-on: windows-latest
    env:
      TRIPLE: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      # Every push to main is a release that installed copies update to, so it
      # needs a version above the last one: 0.1.<run number>. A v* tag sets the
      # version itself. Pull requests build 0.1.0 and publish nothing.
      - name: Version
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"; RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            VERSION="0.1.$GITHUB_RUN_NUMBER"; RELEASE=true
          else
            VERSION="0.1.0"
          fi
          if [[ "$RELEASE" == true && "$HAS_KEY" != true ]]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, so this build is not published as an update"
            RELEASE=false
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "Version $VERSION, release $RELEASE"
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build media server
        working-directory: server
        shell: bash
        run: |
          mkdir -p ../desktop/src-tauri/binaries
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o ../desktop/src-tauri/binaries/rivo-server-$TRIPLE.exe ./cmd/homecinema

      - name: Fetch FFmpeg (LGPL build)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # BtbN renames assets on each FFmpeg release, so pick the newest
          # stable LGPL win64 build from the current list instead of a fixed URL.
          NAME=$(gh release view latest -R BtbN/FFmpeg-Builds --json assets -q '.assets[].name' \
            | grep -E '^ffmpeg-n[0-9.]+-latest-win64-lgpl-[0-9.]+\.zip$' | sort -V | tail -1)
          [ -n "$NAME" ] || { echo "no LGPL win64 build found"; exit 1; }
          echo "Using $NAME"
          gh release download latest -R BtbN/FFmpeg-Builds -p "$NAME" -O ffmpeg.zip
          7z x ffmpeg.zip -offmpeg >/dev/null
          BIN=$(dirname "$(find ffmpeg -name ffmpeg.exe | head -1)")
          cp "$BIN/ffmpeg.exe" desktop/src-tauri/binaries/ffmpeg-$TRIPLE.exe
          cp "$BIN/ffprobe.exe" desktop/src-tauri/binaries/ffprobe-$TRIPLE.exe
          cp "$(dirname "$BIN")/LICENSE.txt" desktop/src-tauri/FFMPEG-LICENSE.txt || true

      - name: Build installer
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          # an absolute Windows path, so the CLI finds it whatever folder it runs from
          echo "{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":$RELEASE}}" > release.json
          npx tauri build --config "$(pwd -W)/release.json"

      # What the app's updater reads: releases/latest/download/latest.json
      - name: Update manifest
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          NSIS=desktop/src-tauri/target/release/bundle/nsis
          EXE="Rivo_${VERSION}_x64-setup.exe"
          node -e '
            const fs = require("fs");
            const [dir, exe, version, repo] = process.argv.slice(1);
            fs.writeFileSync(dir + "/latest.json", JSON.stringify({
              version,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": {
                signature: fs.readFileSync(dir + "/" + exe + ".sig", "utf8"),
                url: `https://github.com/${repo}/releases/download/v${version}/${exe}`,
              } },
            }, null, 2));
          ' "$NSIS" "$EXE" "$VERSION" "$GITHUB_REPOSITORY"
          cat "$NSIS/latest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: Rivo-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Rivo ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/latest.json
          generate_release_notes: true
          make_latest: true
