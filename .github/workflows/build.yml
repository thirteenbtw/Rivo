name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web UI
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm run build
      - name: Go vet and tests
        working-directory: server
        run: |
          go vet ./...
          go test ./...
          GOOS=windows go build -o /dev/null ./cmd/homecinema
      - name: Android server binary (Termux)
        working-directory: server
        # -checklinkname=0: github.com/wlynxg/anet reads net internals so that
        # interface lookups work on Android 11+.
        run: GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-checklinkname=0 -s -w" -o ../rivo-server-android-arm64 ./cmd/homecinema
      - uses: actions/upload-artifact@v4
        with:
          name: rivo-server-android-arm64
          path: rivo-server-android-arm64

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android TV app
        working-directory: tv/android
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          RIVO_VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || RIVO_VERSION="0.1.0-${GITHUB_SHA::7}"
          export RIVO_VERSION
          # A fixed signing key lets a new APK install over the old one.
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then echo "$ANDROID_KEYSTORE_B64" | base64 -d > app/rivo-tv.jks; fi
          gradle --no-daemon assembleRelease
          mkdir -p ../../out
          cp app/build/outputs/apk/release/app-release.apk "../../out/Rivo-AndroidTV-$RIVO_VERSION.apk"

      - name: Build Tizen and webOS apps
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="0.1.0"
          npm install -g @webos-tools/cli >/dev/null 2>&1 || echo "webOS CLI not available, skipping .ipk"
          VERSION="$VERSION" tv/package.sh
          for f in tv/dist/*.ipk; do [ -e "$f" ] && cp "$f" "out/Rivo-webOS-$VERSION.ipk"; done
          cp tv/dist/Rivo-tizen-unsigned.zip "out/Rivo-Tizen-$VERSION-unsigned.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Rivo-tv-apps
          path: out/*

  windows:
    needs: [test, android]
    runs-on: windows-latest
    env:
      TRIPLE: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build media server
        working-directory: server
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="0.1.0-${GITHUB_SHA::7}"
          mkdir -p ../desktop/src-tauri/binaries
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o ../desktop/src-tauri/binaries/rivo-server-$TRIPLE.exe ./cmd/homecinema

      - name: Fetch FFmpeg (LGPL build)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # BtbN renames assets on each FFmpeg release, so pick the newest
          # stable LGPL win64 build from the current list instead of a fixed URL.
          NAME=$(gh release view latest -R BtbN/FFmpeg-Builds --json assets -q '.assets[].name' \
            | grep -E '^ffmpeg-n[0-9.]+-latest-win64-lgpl-[0-9.]+\.zip$' | sort -V | tail -1)
          [ -n "$NAME" ] || { echo "no LGPL win64 build found"; exit 1; }
          echo "Using $NAME"
          gh release download latest -R BtbN/FFmpeg-Builds -p "$NAME" -O ffmpeg.zip
          7z x ffmpeg.zip -offmpeg >/dev/null
          BIN=$(dirname "$(find ffmpeg -name ffmpeg.exe | head -1)")
          cp "$BIN/ffmpeg.exe" desktop/src-tauri/binaries/ffmpeg-$TRIPLE.exe
          cp "$BIN/ffprobe.exe" desktop/src-tauri/binaries/ffprobe-$TRIPLE.exe
          cp "$(dirname "$BIN")/LICENSE.txt" desktop/src-tauri/FFMPEG-LICENSE.txt || true

      - name: Build installer
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # The updater compares the app's version with latest.json, so a
            # release takes its version from the tag and ships a signed update.
            [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "TAURI_SIGNING_PRIVATE_KEY secret is not set"; exit 1; }
            npx tauri build --config "{\"version\":\"${GITHUB_REF_NAME#v}\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
          else
            npx tauri build
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Rivo-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop/src-tauri/target/release/bundle/nsis
        shell: bash
        run: |
          EXE=$(ls *-setup.exe | head -1)
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat "$EXE.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$EXE" \
            '{version: $version, pub_date: $date, platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' > latest.json
          cat latest.json

      - name: TV apps for the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: Rivo-tv-apps
          path: tv-apps

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tv-apps/*
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/release/bundle/nsis/latest.json
          generate_release_notes: true
